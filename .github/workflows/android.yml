name: android apk

# builds the FOKUS android shell (capacitor, loading the live web app) and
# attaches fokus.apk to a rolling release, so the readme button always points
# at the newest build.

on:
  workflow_dispatch:
  push:
    branches: [full-app_beta, main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build -- --base=/fokus/

      - name: Add the android project
        run: npx cap add android

      - name: Sync assets and config
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect the apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk fokus.apk
          ls -lh fokus.apk

      - name: Publish the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: FOKUS for Android
          body: |
            Installable Android build of FOKUS. It loads the live app, so a connection
            is needed for new content; roadmaps you saved in the app stay readable offline.
          files: fokus.apk
          make_latest: true
